name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are safe to cancel; a push to master may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Catches an asset that no longer satisfies NgOptimizedImage, which is how
      # the 16 MB bear.png went unnoticed.
      - name: Check image assets
        run: npm run images:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # playwright.config.ts keys forbidOnly, retries and workers off CI, which
      # GitHub sets, so no extra flags are needed here.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/lk4/browser
          retention-days: 7

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      # Secrets are not readable from a job-level `if`, so the job always starts
      # and short-circuits here instead of failing when it is not configured yet.
      - name: Check deploy configuration
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped; missing secrets:$missing"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download site
        if: steps.config.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # Secrets go through env rather than being interpolated into the script, so
      # nothing in them can be read as shell syntax.
      - name: Configure SSH
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/site2026' }}
        run: |
          # --checksum because downloaded artifacts lose their timestamps, which
          # would otherwise make rsync re-send every file.
          # --chmod so permissions do not depend on the runner's umask.
          rsync -rlz --delete --checksum --chmod=D755,F644 \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            site/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
